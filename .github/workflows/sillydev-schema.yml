name: SillyDev - descubrir creación gratuita
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sillydev-schema.yml'
permissions:
  contents: read
jobs:
  esquema:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Leer contrato público OpenAPI
        run: |
          python - <<'PY'
          import urllib.request,json
          req=urllib.request.Request('https://sillydev.co.uk/docs/panel/openapi.json',headers={'Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as r: spec=json.load(r)
          for path,methods in spec.get('paths',{}).items():
              for method,op in methods.items():
                  if not isinstance(op,dict): continue
                  title=str(op.get('summary',''))
                  if ('free' in (path+' '+title).lower() or 'git' in path.lower()) and method in ('get','post','put','patch'):
                      print(json.dumps({'path':path,'method':method,'summary':title,'parameters':op.get('parameters'),'requestBody':op.get('requestBody')},ensure_ascii=False))
          for name,schema in spec.get('components',{}).get('schemas',{}).items():
              if any(x in name.lower() for x in ('free','create','git','runtime')):
                  print(json.dumps({name:schema},ensure_ascii=False))
          PY
